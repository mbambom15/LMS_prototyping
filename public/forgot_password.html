<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Nkanyezi LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#185fa5;
    --blue-dark:#124a82;
    --ink:#171717;
    --ink-soft:#5f5e5b;
    --border:#e9e9e7;
    --bg:#fbfbfa;
    --card:#ffffff;
    --danger:#a32d2d;
    --danger-bg:#fbeceb;
    --success:#1c6b3e;
    --success-bg:#e9f6ee;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{
    width:100%;
    max-width:420px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    margin-bottom:28px;
  }
  .brand .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--blue);
    flex-shrink:0;
  }
  .brand span{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:36px 32px;
    box-shadow:0 1px 2px rgba(0,0,0,0.03), 0 8px 24px rgba(0,0,0,0.04);
  }
  h1{
    font-size:20px;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 28px;
  }
  form{display:flex;flex-direction:column;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;}
  label{
    font-size:13px;
    font-weight:500;
    color:var(--ink);
  }
  input{
    width:100%;
    min-width:0;
    font-family:inherit;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{color:#b7b6b2;}
  input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(24,95,165,0.12);
  }
  input.invalid{
    border-color:var(--danger);
  }
  .hint{
    font-size:12px;
    color:var(--ink-soft);
  }
  button[type="submit"]{
    margin-top:8px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    border:none;
    border-radius:6px;
    padding:11px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s ease;
  }
  button[type="submit"]:hover:not(:disabled){background:var(--blue-dark);}
  button[type="submit"]:disabled{
    background:#a9c2db;
    cursor:not-allowed;
  }
  .spinner{
    width:14px;height:14px;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  button[type="submit"].loading .spinner{display:inline-block;}
  button[type="submit"].loading .btn-label{display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .banner{
    display:none;
    font-size:13px;
    line-height:1.5;
    padding:12px 14px;
    border-radius:6px;
    margin-bottom:18px;
  }
  .banner.show{display:block;}
  .banner.error{background:var(--danger-bg);color:var(--danger);}
  .banner.success{background:var(--success-bg);color:var(--success);}

  .back{
    margin-top:22px;
    text-align:center;
    font-size:13px;
  }
  .back a{
    color:var(--blue);
    text-decoration:none;
    font-weight:500;
  }
  .back a:hover{text-decoration:underline;}

  .footnote{
    margin-top:18px;
    font-size:12px;
    color:#a8a7a3;
    text-align:center;
    line-height:1.5;
  }

  @media (max-width:420px){
    .row2{grid-template-columns:1fr;}
    .card{padding:28px 20px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
  
    <span>Nkanyezi LMS</span>
  </div>

  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="subtitle">Confirm your details below and we'll email a new password to the address on your account.</p>

    <div id="banner" class="banner"></div>

    <form id="forgot-form" novalidate>
      <div class="row2">
        <div class="field">
          <label for="first_name">First name</label>
          <input type="text" id="first_name" name="first_name" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label for="last_name">Surname</label>
          <input type="text" id="last_name" name="last_name" autocomplete="family-name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="id_number">SA ID number</label>
        <input type="text" id="id_number" name="id_number" inputmode="numeric" autocomplete="off" required>
        <span class="hint">The 13-digit ID number on your profile</span>
      </div>

      <button type="submit" id="submit-btn">
        <span class="spinner"></span>
        <span class="btn-label">Send my new password</span>
      </button>
    </form>

    <div class="back">
      <a href="/login">Back to login</a>
    </div>
  </div>

  <p class="footnote">If these details match an account on file, a new password will be emailed<br>to the address registered on that account.</p>
</div>

<script>
  const form = document.getElementById('forgot-form');
  const banner = document.getElementById('banner');
  const btn = document.getElementById('submit-btn');
  const fields = ['first_name', 'last_name', 'email', 'id_number'];

  function showBanner(type, message) {
    banner.textContent = message;
    banner.className = 'banner show ' + type;
  }

  function clearBanner() {
    banner.className = 'banner';
  }

  function setLoading(isLoading) {
    btn.disabled = isLoading;
    btn.classList.toggle('loading', isLoading);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearBanner();

    let hasError = false;
    const payload = {};
    fields.forEach(id => {
      const el = document.getElementById(id);
      const val = el.value.trim();
      payload[id] = val;
      if (!val) {
        el.classList.add('invalid');
        hasError = true;
      } else {
        el.classList.remove('invalid');
      }
    });

    if (hasError) {
      showBanner('error', 'Please fill in all fields.');
      return;
    }

    setLoading(true);
    try {
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showBanner('success', data.message || 'A new password has been emailed to you.');
        form.reset();
      } else {
        showBanner('error', data.message || 'We could not verify those details. Please check and try again.');
      }
    } catch (err) {
      showBanner('error', 'Something went wrong. Please try again in a moment.');
    } finally {
      setLoading(false);
    }
  });
</script>

</body>
</html>
