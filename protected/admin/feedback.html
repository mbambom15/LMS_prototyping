<!-- admin/feedback.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback — Nkanyezi Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="deal-detail.css">
    <style>
        .fb-compose { border: 1px solid var(--text-3); border-radius: 10px; padding: 18px 20px; margin: 20px 0; }
        .fb-compose-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); margin-bottom: 12px; }
        .fb-field { margin-bottom: 10px; }
        .fb-field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
        .fb-field input, .fb-field select, .fb-field textarea {
            width: 100%; font-size: 13px; padding: 7px 10px; border-radius: 6px;
            border: 1px solid var(--text-3); font-family: 'Inter', sans-serif; box-sizing: border-box;
        }
        .fb-field textarea { resize: vertical; min-height: 80px; }
        .fb-warn { background: rgba(239,68,68,.08); color: var(--red); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
        .fb-thread { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .fb-msg { border: 1px solid var(--text-3); border-radius: 10px; padding: 12px 16px; }
        .fb-msg-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
        .fb-msg-from { font-size: 13px; font-weight: 600; }
        .fb-msg-from.learner { color: var(--blue, #185fa5); }
        .fb-msg-time { font-size: 11px; color: var(--text-3); }
        .fb-msg-subject { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
        .fb-msg-body { font-size: 13px; color: var(--text-2); white-space: pre-wrap; }
    </style>
</head>
<body>

    <nav class="topbar">
        <div class="breadcrumb">
            <a href="dashboard.html">Admin</a>
            <span class="breadcrumb-sep">›</span>
            <a href="#" id="bc-learner-link">Learner</a>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current">Feedback</span>
        </div>
        <div class="topbar-actions">
            <a class="btn-outline" id="back-link" href="#">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
                Back to profile
            </a>
        </div>
    </nav>

    <div class="page-wrap">

        <div class="deal-header" id="feedback-header">
            <div class="deal-eyebrow">Feedback</div>
            <div class="deal-title" id="learner-name">Loading…</div>
            <div class="deal-meta-row" id="learner-meta-row">
                <span style="color:var(--text-3);font-size:12px">Fetching information…</span>
            </div>
        </div>

        <div class="fb-compose">
            <div class="fb-compose-title">Send feedback</div>
            <div id="fb-facilitator-warning" style="display:none" class="fb-warn"></div>
            <div class="fb-field">
                <label for="fb-type">Type</label>
                <select id="fb-type">
                    <option value="general">General</option>
                    <option value="progress">Progress</option>
                    <option value="attendance">Attendance</option>
                    <option value="assessment">Assessment</option>
                    <option value="risk">Risk</option>
                </select>
            </div>
            <div class="fb-field">
                <label for="fb-subject">Subject (optional)</label>
                <input type="text" id="fb-subject" placeholder="e.g. Progress check-in">
            </div>
            <div class="fb-field">
                <label for="fb-message">Message</label>
                <textarea id="fb-message" placeholder="Write your feedback…"></textarea>
            </div>
            <button class="btn-solid" id="fb-send-btn" onclick="sendFeedback()">Send feedback</button>
        </div>

        <div class="section-head">
            <span class="section-title">Feedback history</span>
            <span class="section-count" id="fb-count">0 messages</span>
        </div>

        <div class="fb-thread" id="fb-thread">
            <div class="empty-state"><div class="empty-title">Loading…</div></div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

</body>
</html>
<script src="feedback.js"></script>
